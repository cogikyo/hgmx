# .github/workflows/ci.yml
name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Check Generated Templates
        run: go tool templ generate -path . -check

      - name: Check Generated Contracts
        run: |
          go run ./cmd/hgmx gen
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Check Contract Compatibility
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*')
          echo "Against $tag"
          go run ./cmd/hgmx buf breaking --against ".git#tag=$tag,subdir=proto"

      - name: Verify Vendored Scripts
        run: go run ./scripts/fetch -check scripts

      - name: Verify Icons
        run: go run ./icons/fetch -check icons

      - name: Check Icon Modules
        run: find icons/anim icons/glyph -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Lint Icon Animations
        run: node icons/check/lint.mjs

      - name: Put Postgres on PATH
        run: |
          bin=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)
          test -x "$bin/initdb"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Test
        run: go test -count=1 ./...
        env:
          HGMX_PGTEST: require

      - name: Cross-build CLI
        run: |
          for target in windows/amd64 darwin/arm64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/hgmx
          done

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK Packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
          java -version
          "$sdkmanager" --list_installed

      - name: Adopt Fixture
        run: starters/fixture/adopt.sh "$RUNNER_TEMP/fixture" android

      - name: Commit Fixture
        working-directory: ${{ runner.temp }}/fixture
        run: |
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm fixture

      - name: Check Fixture
        working-directory: ${{ runner.temp }}/fixture
        run: go tool hgmx check

      - name: Build Fixture App
        working-directory: ${{ runner.temp }}/fixture/apps/android
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Seeded Failures
        run: starters/fixture/seeded.sh "$RUNNER_TEMP/fixture"

  ios:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 27.2

      - name: Adopt Starter
        run: starters/fixture/bare.sh "$RUNNER_TEMP/starter" ios

      - name: Build Starter App
        working-directory: ${{ runner.temp }}/starter/apps/ios
        run: xcodebuild -project Starter.xcodeproj -scheme Starter -destination "generic/platform=iOS Simulator" -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO build

      - name: Adopt Fixture
        run: starters/fixture/adopt.sh "$RUNNER_TEMP/fixture" ios

      - name: Commit Fixture
        working-directory: ${{ runner.temp }}/fixture
        run: |
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm fixture

      - name: Check Fixture
        working-directory: ${{ runner.temp }}/fixture
        run: go tool hgmx check

      - name: Build Fixture App
        working-directory: ${{ runner.temp }}/fixture/apps/ios
        run: xcodebuild -project Starter.xcodeproj -scheme Starter -destination "generic/platform=iOS Simulator" -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO build

      - name: Test Fixture App
        working-directory: ${{ runner.temp }}/fixture/apps/ios
        run: xcodebuild -project Starter.xcodeproj -scheme Starter -destination "platform=iOS Simulator,name=iPhone 17,OS=27.2" -onlyUsePackageVersionsFromResolvedFile test

      - name: Seeded Failures
        run: starters/fixture/seeded.sh "$RUNNER_TEMP/fixture"
